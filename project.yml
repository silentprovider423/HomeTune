name: HomeTune
options:
  bundleIdPrefix: org.homeroll
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  HomeTune:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: HomeTune
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: "Verbindung zu deinem Musikserver im Heimnetz."
        # „Öffnen in HomeTune“/„Teilen“ für Audiodateien (iOS legt eine Kopie in den Posteingang)
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.mp3, public.mpeg-4-audio, org.xiph.flac, com.microsoft.waveform-audio, public.aiff-audio, public.aifc-audio, com.apple.coreaudio-format]
        LSSupportsOpeningDocumentsInPlace: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.homeroll.hometune
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HomeTuneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: ["Fixtures/**"]
      # Testdateien (erfundene Titel, Sinus/Stille – tools/make-test-audio.sh) mit Ordnerstruktur
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: HomeTune
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.homeroll.hometune.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HomeTune.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HomeTune
        BUNDLE_LOADER: $(TEST_HOST)
  HomeTuneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: HomeTune
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.homeroll.hometune.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HomeTune
schemes:
  HomeTune:
    build:
      targets:
        HomeTune: all
        HomeTuneTests: [test]
        HomeTuneUITests: [test]
    test:
      targets: [HomeTuneTests, HomeTuneUITests]
